          description: ''
  /api/appointments/my/:
    get:
      operationId: appointments_my_list
      description: Retrieve a list of reservations for the currently authenticated
        client.
      summary: List client appointments
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -start
          - created_at
          - start
        description: 'Which field to use when ordering the results. Options: `start`,
          `created_at`. Prefix with `-` for descending order (e.g. `-start`). Default
          is `-start`.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - confirmed
          - in_progress
          - no_show
          - pending
        description: Filter appointments by status (e.g. pending, confirmed, completed,
          cancelled, in_progress, no_show)
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
