          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - is_master
      - is_staff
      - last_name
      - last_update_user
      - phone
      - registration_date_user
    VerifyEmail:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
      required:
      - id
      - token
    WorkingSchedule:
      type: object
      properties:
        weekday:
          allOf:
          - $ref: '#/components/schemas/WorkingScheduleWeekdayEnum'
          minimum: 0
          maximum: 32767
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        is_closed:
          type: boolean
      required:
      - weekday
    WorkingScheduleWeekdayEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      type: integer
      description: |-
        * `1` - Monday
        * `2` - Tuesday
        * `3` - Wednesday
        * `4` - Thursday
        * `5` - Friday
        * `6` - Saturday
        * `7` - Sunday
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
