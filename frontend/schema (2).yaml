openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/appointments/{appointment_id}/review/:
    get:
      operationId: appointments_review_retrieve
      summary: Get review for specific appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentReview'
          description: ''
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Review not found
    post:
      operationId: appointments_review_create
      summary: Create review for specific appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentReview'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentReview'
          description: ''
        '400':
          description: Validation error (e.g., review already exists, appointment
            is not completed, or not owned by user)
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Appointment not found
    patch:
      operationId: appointments_review_partial_update
      summary: Update review for specific appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentReview'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentReview'
          description: ''
        '400':
          description: Validation error
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Review not found
    delete:
      operationId: appointments_review_destroy
      summary: Delete review for specific appointment
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Review successfully deleted
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Review not found
  /api/appointments/{id}/cancel/:
    patch:
      operationId: appointments_cancel_partial_update
      description: Cancels the customer's upcoming booking (sets the status to 'cancelled').
        Request body is optional.
      summary: Cancel client appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '400':
          description: Validation error (e.g. appointment is already completed or
            cancelled)
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Appointment not found or does not belong to the user
  /api/appointments/{id}/reschedule/:
    patch:
      operationId: appointments_reschedule_partial_update
      description: Moves an existing customer reservation to a new datetime interval.
      summary: Reschedule client appointment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReschedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReschedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReschedule'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reschedule'
          description: ''
        '400':
          description: Validation error (e.g., end time is before start time, or appointment
            is already completed/cancelled)
        '401':
          description: Authentication credentials were not provided
        '404':
          description: Appointment not found or does not belong to the user
  /api/appointments/{id}/status/:
    patch:
      operationId: appointments_status_partial_update
      description: |-
        Allows an authenticated master to update the status of their assigned appointment.

        **Allowed status transitions:**
        - `pending` ➔ `confirmed`, `cancelled`
        - `confirmed` ➔ `in_progress`, `cancelled`
        - `in_progress` ➔ `completed`
        - `completed` ➔ (none, final status)
        - `cancelled` ➔ (none, final status)

        **Note:** If status is set to `cancelled`, `cancellation_reason` is required.
      summary: Update appointment status by master
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMasterStatusUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMasterStatusUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMasterStatusUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterStatusUpdate'
          description: ''
        '400':
          description: Validation error (e.g. missing cancellation_reason when status='cancelled')
        '401':
          description: Authentication credentials were not provided
        '403':
          description: Permission denied or appointment not assigned to this master
        '404':
          description: Appointment not found
        '409':
          description: Status transition conflict (e.g. invalid status transition
            like completed ➔ in_progress)
  /api/appointments/available-slots/:
    get:
      operationId: appointments_available_slots_retrieve
      description: |-
        Returns a list of available time slots for booking, grouped by date.

        Required query parameters: `salon`, `master`, `service`, `date_from`.
      summary: Get available booking slots
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: 'Start date for slot lookup (format: YYYY-MM-DD)'
        required: true
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: 'End date for slot lookup (format: YYYY-MM-DD, inclusive; defaults
          to date_from)'
      - in: query
        name: master
        schema:
          type: integer
        description: ID of the master (used to query busy time ranges)
        required: true
      - in: query
        name: salon
        schema:
          type: integer
        description: ID of the salon (used to fetch daily working hours)
        required: true
      - in: query
        name: service
        schema:
          type: integer
        description: ID of the service (used to compute required slot duration)
        required: true
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                AvailableSlotsExample:
                  value:
                    '2026-08-01':
                    - start: '10:00'
                      end: '10:45'
                    - start: '10:15'
                      end: '11:00'
                    '2026-08-02': []
                  summary: Available slots example
          description: Map of dates to array of available time slots
        '400':
          description: Validation error (missing required parameters, invalid date
            format, or invalid IDs)
        '401':
          description: Authentication credentials were not provided
  /api/appointments/master/{id}/:
    get:
      operationId: appointments_master_retrieve
      description: Retrieve detailed information about a specific appointment assigned
        to the currently authenticated master.
      summary: Get master appointment detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
