              schema:
                $ref: '#/components/schemas/MasterAppointmentDetail'
          description: ''
        '401':
          description: Authentication credentials were not provided
        '403':
          description: Permission denied (Requires master profile)
        '404':
          description: Appointment not found or not assigned to this master
  /api/appointments/master/active/:
    get:
      operationId: appointments_master_active_list
      description: Returns active appointments (pending, confirmed, in_progress) assigned
        to the current master.
      summary: List active master appointments
      parameters:
      - in: query
        name: appointment_date
        schema:
          type: string
          format: date
        description: Filter by date (YYYY-MM-DD)
      - in: query
        name: client
        schema:
          type: string
        description: Filter by client email (contains)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Ordering: start, created_at, status, service__price (prefix
          with ''-'' for descending)'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: service
        schema:
          type: string
        description: Filter by service name (contains)
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (pending, confirmed, in_progress)
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMasterAppointmentListList'
          description: ''
  /api/appointments/master/history/:
    get:
      operationId: appointments_master_history_list
