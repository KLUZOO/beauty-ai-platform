        description: Filter from this date (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Filter to this date (YYYY-MM-DD)
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Ordering: start, created_at, status, service__price (prefix
