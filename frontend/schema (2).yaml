  /api/services/:
    get:
      operationId: services_list
      description: Retrieve a list of active beauty services. Supports filtering by
        name, category, salon, master, price range, city, and datetime availability
        window.
      summary: List active services
      parameters:
      - in: query
        name: available_datetime_from
        schema:
          type: string
          format: date-time
        description: 'Start of datetime window for availability check (ISO 8601 format:
          YYYY-MM-DDTHH:MM:SSZ). **Requires `available_datetime_to`**.'
      - in: query
        name: available_datetime_to
        schema:
          type: string
          format: date-time
        description: 'End of datetime window for availability check (ISO 8601 format:
          YYYY-MM-DDTHH:MM:SSZ). **Must be later than `available_datetime_from`**.'
      - in: query
        name: category
        schema:
          type: string
        description: Filter by category name (case-insensitive search)
      - in: query
        name: city
        schema:
          type: string
        description: Filter by salon city (case-insensitive search)
      - in: query
        name: masters
        schema:
          type: string
        description: Filter by master ID or comma-separated list of IDs (e.g. `5`
          or `5,10`)
      - in: query
        name: max_price
        schema:
          type: number
        description: Filter by maximum price (less than or equal)
      - in: query
        name: min_price
        schema:
          type: number
        description: Filter by minimum price (greater than or equal)
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -duration_minutes
          - -name
          - -popularity
          - -price
          - duration_minutes
          - name
          - popularity
          - price
        description: 'Which field to use when ordering the results. Options: `name`,
          `popularity`, `price`, `duration_minutes`. Prefix with `-` for descending
          order.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: salons
        schema:
          type: string
        description: Filter by salon ID or comma-separated list of IDs (e.g. `1` or
          `1,2,3`)
      - in: query
        name: service_name
        schema:
          type: string
        description: Filter by service name (case-insensitive search)
      tags:
      - services
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServicesList'
          description: ''
        '400':
          description: Validation error (e.g. `available_datetime_from` was passed
            without `available_datetime_to`, or `available_datetime_to` is earlier
            than `available_datetime_from`)
