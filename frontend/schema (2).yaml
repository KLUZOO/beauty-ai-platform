components:
  schemas:
    AccountStatusEnum:
      enum:
      - active
      - inactive
      - blocked
      - deleted
      - pending
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `blocked` - Blocked
        * `deleted` - Deleted
        * `pending` - Pending
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        master:
          type: integer
        salon:
          type: integer
        service:
          type: integer
        promo_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - created_at
      - end
      - id
      - master
      - salon
      - service
      - start
    AppointmentReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        appointment:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
        master:
          type: integer
          readOnly: true
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment
      - client
      - created_at
      - id
      - master
      - rating
    AssignedSalons:
      type: object
      description: Nested serializer for brief salon details.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    ChangePassword:
      type: object
      description: Serializer for handling password changes by authenticated users.
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    DayOff:
      type: object
      description: Serializer for creating and validating a master's days off / vacations.
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - start_date
      - updated_at
    FavoriteMaster:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        profile_photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        salons:
          type: array
          items:
            $ref: '#/components/schemas/SalonShort'
          readOnly: true
        active_services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
        favorite_created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_services
      - average_rating
      - favorite_created_at
      - id
      - name
      - profile_photo
      - salons
    FavoriteMasterStatus:
      type: object
      properties:
        is_favorite:
          type: boolean
      required:
      - is_favorite
    GoogleLogin:
      type: object
      description: Serializer for accepting Google ID tokens during OAuth2 authentication.
      properties:
        id_token:
          type: string
      required:
      - id_token
    MasterAppointmentDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        client_id:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        client_phone:
          type: string
          readOnly: true
        client_email:
          type: string
          format: email
          readOnly: true
        service_id:
          type: integer
          readOnly: true
        service_name:
          type: string
          readOnly: true
        service_duration:
          type: integer
          readOnly: true
        service_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        salon_id:
          type: integer
          readOnly: true
        salon_name:
          type: string
          readOnly: true
        salon_address:
          type: string
          readOnly: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_email
      - client_id
      - client_name
      - client_phone
      - created_at
      - end
      - id
      - salon_address
      - salon_id
      - salon_name
      - service_duration
      - service_id
      - service_name
      - service_price
      - start
      - updated_at
    MasterAppointmentHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        service_name:
          type: string
          readOnly: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusEnum'
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
          maxLength: 255
      required:
      - client_name
      - created_at
      - duration_minutes
      - end
      - id
      - service_name
      - start
      - total_price
    MasterAppointmentList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        client_name:
          type: string
          readOnly: true
        service_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        duration_minutes:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        salon_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_name
      - created_at
      - duration_minutes
      - end
      - id
      - salon_name
      - service_name
      - start
      - total_price
    MasterList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        photo:
          type: string
          format: uri
        average_rating:
          type: number
          format: double
          readOnly: true
        years_of_experience:
          type: integer
          maximum: 2147483647
          minimum: 0
        salons:
          type: array
          items:
            $ref: '#/components/schemas/SalonShort'
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
      required:
      - average_rating
      - first_name
      - id
      - last_name
      - photo
      - salons
      - services
      - years_of_experience
    MasterProfile:
      type: object
      description: Serializer for public and personal master profiles with nested
        relations.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        bio:
          type: string
          nullable: true
        years_of_experience:
          type: integer
          maximum: 2147483647
          minimum: 0
        average_rating:
          type: number
          format: double
          description: Calculate average rating, returning 0.0 if no reviews exist.
          readOnly: true
        total_reviews:
          type: integer
          description: Return total number of reviews received by the master.
          readOnly: true
        assigned_salons:
          type: array
          items:
            $ref: '#/components/schemas/AssignedSalons'
          readOnly: true
        active_services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
        account_status:
          allOf:
          - $ref: '#/components/schemas/AccountStatusEnum'
          readOnly: true
        registration_date_master:
          type: string
          format: date-time
          readOnly: true
        last_update_master:
          type: string
          format: date-time
          readOnly: true
        working_schedule:
          type: array
          items:
            $ref: '#/components/schemas/WorkingSchedule'
          readOnly: true
        photo:
          type: string
          format: uri
      required:
      - account_status
      - active_services
      - assigned_salons
      - average_rating
      - email
      - first_name
      - id
      - last_name
      - last_update_master
      - phone
      - photo
      - registration_date_master
      - total_reviews
      - working_schedule
      - years_of_experience
    MasterReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        client_profile_photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
        service_name:
          type: string
          readOnly: true
        appointment_date:
          type: string
          format: date
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - appointment_date
      - client_name
      - client_profile_photo
      - created_at
      - id
      - rating
      - service_name
    MasterStatusUpdate:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        cancellation_reason:
          type: string
          nullable: true
          maxLength: 255
    PaginatedAppointmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
