server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html/beauty.ai;
    index index.html;

    # Forward the browser's same-origin AI request to the AI service.
    # The /ai-chat prefix is only used by the frontend proxy and is not
    # part of the upstream service route.
    location /ai-chat/ {
        proxy_pass http://beautyaiservice.polandcentral.cloudapp.azure.com:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location = /ai-chat {
        return 308 /ai-chat/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}