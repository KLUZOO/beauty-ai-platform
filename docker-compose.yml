services:

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile_local
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Mount only the backend folder
    depends_on:
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile_local
    command: celery -A config worker -l info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app  # Mount only the backend folder
    depends_on:
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile_local
    command: celery -A config beat -l info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app  # Mount only the backend folder
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  ai-assistant:
    build:
      context: ./ai-assistant  # Go to the assistant folder
      dockerfile: Dockerfile   # The Dockerfile is located right in this folder
    env_file:
      - ./ai-assistant/.env
    ports:
      - "8001:8001"
    volumes:
      # We wake up the code for convenient development
      - ./ai-assistant:/app
      # Tunnel to save conversation history on your computer
      - ./ai_assistant_data:/app/data
    depends_on:
      - web
