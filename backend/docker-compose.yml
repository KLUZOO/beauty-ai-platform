services:

  web:
    build:
      context: .
      dockerfile: Dockerfile_local
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis

  celery:
    build:
      context: .
      dockerfile: Dockerfile_local
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  beat:
    build:
      context: .
      dockerfile: Dockerfile_local
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"