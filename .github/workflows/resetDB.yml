name: ResetDB

on: 
  workflow_dispatch:

  
permissions:
  id-token: write
  contents: read

jobs:
  Reset-db:
    name: "ResetDbdata"
    runs-on: ubuntu-latest

    steps:
    - name: Azure login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Reseting DB
      run: |
        az vm run-command invoke \
          --resource-group beauty-app-rg \
          --name TestingVM \
          --command-id RunShellScript \
          --scripts "sudo /home/developer/flushdb.sh"

    - name: Create Djangosuperuser
      run: |
        az vm run-command invoke \
          --resource-group beauty-app-rg \
          --name TestingVM \
          --command-id RunShellScript \
          --scripts "docker exec beauty-web python manage.py createsuperuser --noinput"
